<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>E-Party</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      background: #f8fafc; color: #0f172a;
    }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } p { color: #94a3b8; } }
    img { width: 88px; height: 88px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 4px 0; color: #475569; }
    button {
      margin-top: 24px; padding: 12px 24px; border: 0; border-radius: 12px;
      background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>ინტერნეტთან კავშირი არ არის</h1>
    <p>შეამოწმეთ კავშირი და სცადეთ ხელახლა.</p>
    <p>You are offline. Check your connection and try again.</p>
    <button onclick="location.reload()">ხელახლა ცდა / Retry</button>
  </main>
</body>
</html>
